name: Windows installer
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      update_release:
        description: Create a draft stable update in this repository
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: windows-installer
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.build-tools/vcpkg-cache,readwrite
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.REEL_RELEASE_TOKEN }}
          UPDATE_RELEASE: ${{ github.event_name == 'push' || inputs.update_release }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'Configure the REEL_RELEASE_TOKEN repository secret with Contents and Workflows write permissions.' }
          gh api 'repos/${{ github.repository }}' --silent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:UPDATE_RELEASE -eq 'true') {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $tag = "v$version"
            $existing = gh release view $tag --repo '${{ github.repository }}' --json isDraft --jq .isDraft 2>$null
            if ($LASTEXITCODE -eq 0) {
              if ($existing -ne 'true') { throw 'Do not change a published version. Bump package.json before building a new release.' }
            } else {
              $notes = Join-Path $env:RUNNER_TEMP 'reel-release-notes.md'
              [System.IO.File]::WriteAllText($notes, '')
              gh release create $tag --repo '${{ github.repository }}' --target '${{ github.sha }}' --draft --title "Reel $version" --notes-file $notes
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: build/Release/reel_engine.node
          key: windows-2022-native-v1-${{ hashFiles('native/**', 'CMakeLists.txt', 'package-lock.json') }}
      - uses: actions/cache/restore@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        id: vcpkg-cache
        with:
          path: .build-tools/vcpkg-cache
          key: windows-2022-vcpkg-v1-${{ hashFiles('native/vcpkg.json', 'native/triplets/*.cmake') }}
      - uses: actions/checkout@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          repository: microsoft/vcpkg
          ref: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0
          path: .build-tools/vcpkg
      - name: Build native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build-tools/vcpkg-cache | Out-Null
          & .build-tools/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run native -- --runtime electron --runtime-version 44.7.2 --arch x64 --CDCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/.build-tools/vcpkg/scripts/buildsystems/vcpkg.cmake" --CDVCPKG_MANIFEST_DIR="$env:GITHUB_WORKSPACE/native" --CDVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/native/triplets" --CDVCPKG_TARGET_TRIPLET=x64-windows-static --CDCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.native-cache.outputs.cache-hit != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        with:
          path: .build-tools/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: success() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: build/Release/reel_engine.node
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: subtitle-cache
        with:
          path: Vendor/SubtitleTools
          key: windows-2022-python312-subtitles-v1-${{ hashFiles('scripts/subtitle-tools/**') }}
      - name: Build subtitle tools
        if: steps.subtitle-cache.outputs.cache-hit != 'true'
        run: python scripts/subtitle-tools/build.py
      - uses: actions/cache/save@v4
        if: success() && steps.subtitle-cache.outputs.cache-hit != 'true'
        with:
          path: Vendor/SubtitleTools
          key: ${{ steps.subtitle-cache.outputs.cache-primary-key }}
      - run: npm test
      - run: npm run package:win -- --publish never
      - name: Verify update artifacts
        run: node scripts/check-update-artifacts.mjs
      - name: Test packaged application
        shell: pwsh
        run: |
          $env:REEL_APP_PATH = "$env:GITHUB_WORKSPACE/dist/win-unpacked/Reel.exe"
          npm run test:smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save validated installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/Reel-Setup-*.exe
            dist/Reel-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7
      - name: Save draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.REEL_RELEASE_TOKEN }}
          UPDATE_RELEASE: ${{ github.event_name == 'push' || inputs.update_release }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'reel-release-notes.md'
          [System.IO.File]::WriteAllText($notes, '')
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          if (-not (Test-Path dist/latest.yml)) { throw 'Update metadata missing' }
          if (@(Get-ChildItem dist -Filter '*.exe').Count -eq 0) { throw 'Windows installer missing' }
          if ($env:UPDATE_RELEASE -eq 'true') {
            $tag = "v$version"
            $existing = gh release view $tag --repo '${{ github.repository }}' --json isDraft --jq .isDraft 2>$null
            if ($LASTEXITCODE -eq 0) {
              if ($existing -ne 'true') { throw 'Do not change a published version. Bump package.json before building a new release.' }
              gh release upload $tag @assets --repo '${{ github.repository }}'
            } else {
              gh release create $tag @assets --repo '${{ github.repository }}' --target '${{ github.sha }}' --draft --title "Reel $version" --notes-file $notes
            }
          } else {
            $tag = "v$version-windows-test-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release create $tag @assets --repo '${{ github.repository }}' --target '${{ github.sha }}' --draft --prerelease --title "Reel $version Windows test" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish stable update
        if: github.event_name == 'push' || inputs.update_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.REEL_RELEASE_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "v$version" --repo '${{ github.repository }}' --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
